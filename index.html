<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Sheet — Estimating &amp; Project To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#d9662a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Task Sheet" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🏗️</span>
    <div>
      <h1>Task Sheet</h1>
      <p class="tagline">Estimator &amp; PM job tracker</p>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="topbar-actions">
    <button class="btn btn-primary hidden" id="install-btn" title="Install Task Sheet as an app on this computer">⤓ Install App</button>
    <button class="btn btn-ghost hidden" id="connect-file-btn" title="Link a file on disk that auto-loads and auto-saves every time you open this app">🔗 Connect Save File</button>
    <button class="btn btn-ghost" id="export-btn" title="Save all data to a .json file on your computer (Ctrl/Cmd+S)">Export</button>
    <button class="btn btn-ghost" id="import-btn" title="Load data from a previously exported .json file">Import</button>
    <input type="file" id="import-file-input" accept="application/json" class="hidden" />
    <button class="btn btn-ghost" id="archive-toggle-btn">Archive</button>
  </div>
</header>
<div class="segment-divider" aria-hidden="true"></div>

<div class="backup-banner hidden" id="backup-banner">
  <span class="backup-banner-text" id="backup-banner-text"></span>
  <div class="backup-banner-actions">
    <button class="btn btn-primary btn-small" id="backup-banner-export">Export Now</button>
    <button class="btn btn-ghost btn-small" id="backup-banner-dismiss">Remind Me Later</button>
  </div>
</div>

<p class="save-status" id="save-status"></p>

<main class="board" id="board">
  <section class="column" data-type="active">
    <div class="column-head">
      <h2>Active Jobs <span class="column-count" id="active-count">0</span></h2>
      <p class="column-sub">Order by what needs attention first</p>
    </div>
    <div class="job-list" id="active-list" data-list="active"></div>
    <button class="btn btn-add" data-add="active">+ Add Active Job</button>
  </section>

  <section class="column" data-type="bidding">
    <div class="column-head">
      <h2>Jobs to Bid <span class="column-count" id="bidding-count">0</span></h2>
      <p class="column-sub">Order by bid deadline / priority</p>
    </div>
    <div class="job-list" id="bidding-list" data-list="bidding"></div>
    <button class="btn btn-add" data-add="bidding">+ Add Bid</button>
  </section>
</main>

<section class="archive-panel hidden" id="archive-panel">
  <div class="column-head">
    <h2>Archive <span class="column-count" id="archive-count">0</span></h2>
    <p class="column-sub">Won, lost, and completed jobs</p>
  </div>
  <div class="job-list" id="archive-list"></div>
</section>

<!-- Job detail / edit modal -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" id="job-modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>

    <div class="modal-body" id="modal-body"><!-- injected --></div>
  </div>
</div>

<template id="new-job-defaults"></template>

<div class="reminder-toasts" id="reminder-toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
